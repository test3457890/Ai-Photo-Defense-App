[package]
name = "photo-media"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Multimedia: content-based format detection, MP4/MOV and Matroska inspection, lossless video metadata removal, audio decoding, analysis, privacy redaction and protection engine"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
photo-privacy.workspace = true
photo-log.workspace = true
photo-models = { workspace = true, optional = true }
# Pure-Rust audio demuxing and decoding (MPL-2.0, used unmodified as a library).
symphonia = { version = "0.5", default-features = false, features = ["aac", "adpcm", "aiff", "alac", "caf", "flac", "isomp4", "mkv", "mp1", "mp2", "mp3", "ogg", "pcm", "vorbis", "wav"] }
hound = "3.5"
rustfft = "6.4"
ebur128 = "0.1"
# FilmCraft's own pure-Rust codecs (MIT OR Apache-2.0), pinned to the commit FilmCraft itself uses.
craft-video = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248", default-features = false, features = ["h264-decode", "h264-encode"], optional = true }
craft-audio = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248", default-features = false, features = ["opus-decode"], optional = true }
candle-core = { version = "0.11.1", optional = true }
candle-nn = { version = "0.11.1", optional = true }
candle-transformers = { version = "0.11.1", optional = true }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"], optional = true }

[features]
default = []
stt = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]
voice-protect = ["dep:candle-core", "dep:candle-nn", "dep:photo-models"]
video = ["dep:craft-video"]
opus = ["dep:craft-audio"]

[dev-dependencies]
image.workspace = true
craft-audio = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248", default-features = false, features = ["opus-decode", "opus-encode"] }

[[example]]
name = "synth_h264"
required-features = ["video"]
