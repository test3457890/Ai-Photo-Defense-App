[package]
name = "photo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "photo-defense"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
image.workspace = true
serde_json.workspace = true
photo-core.workspace = true
photo-engine = { workspace = true, optional = true }
photo-lab.workspace = true
photo-models.workspace = true
photo-edit.workspace = true
photo-privacy.workspace = true
photo-pipeline.workspace = true
photo-media.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
default = []
experimental-clip = ["dep:photo-engine", "photo-engine/clip"]
stt = ["photo-media/stt"]
voice-protect = ["photo-media/voice-protect"]
faces = ["photo-privacy/faces"]
