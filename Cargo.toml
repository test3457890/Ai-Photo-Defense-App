[workspace]
members = ["crates/*"]
default-members = ["crates/cli"]
resolver = "2"

[workspace.package]
version = "1.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/test3457890/Ai-Photo-Defense-App"
publish = false

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp", "gif"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.23"
photo-core = { path = "crates/core" }
photo-engine = { path = "crates/engine" }
photo-models = { path = "crates/models" }
photo-lab = { path = "crates/lab" }
photo-edit = { path = "crates/edit" }
photo-privacy = { path = "crates/privacy" }
photo-pipeline = { path = "crates/pipeline" }
photo-log = { path = "crates/log" }
photo-project = { path = "crates/project" }
photo-catalog = { path = "crates/catalog" }
photo-media = { path = "crates/media" }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
