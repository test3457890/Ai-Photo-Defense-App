# cargo-audit configuration. Keep in sync with deny.toml.
[advisories]
# RUSTSEC-2023-0071 (Marvin attack, rsa 0.9): timing side channel on RSA *private-key*
# operations. rsa is pulled in only by the optional `c2pa` feature (c2pa 0.92.3 ->
# c2pa_raw_crypto 0.3.0, latest at the time of review). The application signs with ES256
# (ECDSA P-256) only and never performs RSA private-key operations, so the vulnerable path is
# not reachable. Remove this entry when c2pa_raw_crypto moves to rsa >= 0.10.
ignore = ["RUSTSEC-2023-0071"]
