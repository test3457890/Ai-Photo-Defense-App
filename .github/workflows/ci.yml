name: Rust verification
on:
  push:
    branches: [main, 'development/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-intel
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-apple-silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.100.0 --profile minimal
      - run: rustup target add ${{ matrix.target }} --toolchain 1.100.0
      - name: Native host tests
        run: cargo test --locked --workspace --all-features
      - name: Build target applications
        run: cargo build --locked --workspace --all-features --target ${{ matrix.target }}
      - name: Upload development build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/debug/photo-defense
            target/${{ matrix.target }}/debug/photo-defense.exe
            target/${{ matrix.target }}/debug/photo-desktop
            target/${{ matrix.target }}/debug/photo-desktop.exe
          if-no-files-found: error
          retention-days: 7
