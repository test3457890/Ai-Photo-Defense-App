name: Rust verification
on:
  push:
    branches: [main, 'development/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - name: Linux audio headers (ALSA, used only for local A/B playback)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Default-feature build of every target (examples, tests)
        run: cargo check --locked --workspace --all-targets
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-intel
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-apple-silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.100.0 --profile minimal
      - run: rustup target add ${{ matrix.target }} --toolchain 1.100.0
      - name: Linux audio headers (ALSA, used only for local A/B playback)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: Native host tests
        run: cargo test --locked --workspace --all-features
      - name: Build target applications
        run: cargo build --locked --workspace --all-features --target ${{ matrix.target }}
      - name: Upload development build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/debug/photo-defense
            target/${{ matrix.target }}/debug/photo-defense.exe
            target/${{ matrix.target }}/debug/photo-desktop
            target/${{ matrix.target }}/debug/photo-desktop.exe
          if-no-files-found: error
          retention-days: 7
  gui-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.100.0 --profile minimal
      - name: Linux GUI and audio runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config xvfb fonts-dejavu-core imagemagick x11-apps libxkbcommon-x11-0 libxkbcommon0 libx11-xcb1 libxcursor1 libxrandr2 libxi6
      - name: Build desktop application (release, as shipped)
        run: cargo build --locked --release -p photo-desktop
      - name: Launch desktop app and capture screenshot (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/apd-smoke gui-smoke-artifacts
          xvfb-run -a -s "-screen 0 1280x800x24" bash -c '
            export APD_DATA_DIR=/tmp/apd-smoke
            ./target/release/photo-desktop > gui-smoke-artifacts/stdout.txt 2> gui-smoke-artifacts/stderr.txt &
            APP_PID=$!
            sleep 15
            if ! kill -0 "$APP_PID"; then echo "App exited early"; cat gui-smoke-artifacts/stderr.txt; exit 1; fi
            import -window root gui-smoke-artifacts/gui-smoke-linux.png || xwd -root -out gui-smoke-artifacts/gui-smoke-linux.xwd
            kill "$APP_PID" || true
            wait "$APP_PID" || true
          '
          cat gui-smoke-artifacts/stderr.txt || true
      - name: Launch desktop app and capture screenshot (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p /tmp/apd-smoke gui-smoke-artifacts
          export APD_DATA_DIR=/tmp/apd-smoke
          ./target/release/photo-desktop > gui-smoke-artifacts/stdout.txt 2> gui-smoke-artifacts/stderr.txt &
          APP_PID=$!
          sleep 15
          if ! kill -0 "$APP_PID"; then echo "App exited early"; cat gui-smoke-artifacts/stderr.txt; exit 1; fi
          screencapture -x gui-smoke-artifacts/gui-smoke-macos.png || echo "screencapture unavailable on runner"
          kill "$APP_PID" || true
          wait "$APP_PID" || true
          cat gui-smoke-artifacts/stderr.txt || true
      - name: Verify startup log has no errors
        run: |
          ls -la /tmp/apd-smoke /tmp/apd-smoke/logs || { cat gui-smoke-artifacts/stderr.txt; exit 1; }
          cp -r /tmp/apd-smoke/logs gui-smoke-artifacts/logs
          grep -rq "started" /tmp/apd-smoke/logs
          if grep -rqE '"level":"Error"|\bERROR\b' /tmp/apd-smoke/logs; then
            echo "Error found in application log:"
            cat /tmp/apd-smoke/logs/*
            exit 1
          fi
      - name: Upload GUI smoke screenshots and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gui-smoke-${{ matrix.os }}
          path: gui-smoke-artifacts/
          retention-days: 7
