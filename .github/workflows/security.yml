name: Dependency security
on:
  push:
    branches: [main, 'development/**']
  pull_request:
  schedule:
    - cron: '43 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.100.0 --profile minimal
      - run: cargo install cargo-audit --version 0.23.0 --locked
      - run: cargo install cargo-deny --version 0.22.1 --locked
      - run: cargo deny check
      - run: cargo deny --all-features check
      - run: cargo audit --json > audit.json
      - run: python3 scripts/sbom.py sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-evidence
          path: |
            audit.json
            sbom.cdx.json
          retention-days: 14

