name: Dependency security
on:
  push:
    branches: [main, 'development/**']
  pull_request:
  schedule:
    - cron: '43 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.100.0 --profile minimal
      - run: cargo install cargo-audit --version 0.23.0 --locked
      - run: cargo install cargo-deny --version 0.22.1 --locked
      - run: cargo deny check
      - run: cargo audit --json > audit.json
      - run: python3 scripts/sbom.py sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-evidence
          path: |
            audit.json
            sbom.cdx.json
          retention-days: 14
