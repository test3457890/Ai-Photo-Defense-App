name: Unsigned installer packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.100.0 --profile minimal
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p dist
          python3 scripts/sbom.py dist/sbom.cdx.json
          sha256sum dist/sbom.cdx.json > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: dist/
          retention-days: 14

  windows-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.100.0 --profile minimal
      - name: Build release binaries
        run: cargo build --locked --release -p photo-desktop -p photo-cli --features photo-desktop/faces,photo-desktop/c2pa,photo-cli/faces,photo-cli/c2pa
      - name: Install cargo-wix and build unsigned MSI
        shell: pwsh
        run: |
          cargo install cargo-wix --version 0.3.9 --locked
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          cargo wix --nocapture --no-build -p photo-desktop -i packaging/wix/main.wxs -o dist/ai-photo-defense-windows-x64-unsigned.msi
          Copy-Item LICENSE, THIRD_PARTY.md, PRIVACY.md dist/
          Get-FileHash dist/* -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $(Split-Path -Leaf $_.Path)"
          } | Set-Content -Encoding utf8 dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-windows-x64-unsigned
          path: dist/
          retention-days: 14

  linux-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.100.0 --profile minimal
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config desktop-file-utils libfuse2
      - name: Build release binaries
        run: cargo build --locked --release -p photo-desktop -p photo-cli --features photo-desktop/faces,photo-desktop/c2pa,photo-cli/faces,photo-cli/c2pa
      - name: Build .deb package
        run: |
          mkdir -p dist
          cargo install cargo-deb --version 3.8.0 --locked
          cargo deb -p photo-desktop --no-build -o dist/ai-photo-defense-linux-x64-unsigned.deb
      - name: Build AppImage (unsigned)
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/doc/ai-photo-defense
          cp target/release/photo-desktop AppDir/usr/bin/photo-desktop
          cp target/release/photo-defense AppDir/usr/bin/photo-defense
          cp packaging/linux/ai-photo-defense.desktop AppDir/ai-photo-defense.desktop
          cp packaging/linux/ai-photo-defense.desktop AppDir/usr/share/applications/ai-photo-defense.desktop
          cp LICENSE THIRD_PARTY.md PRIVACY.md AppDir/usr/share/doc/ai-photo-defense/
          cat > AppDir/AppRun << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/photo-desktop" "$@"
          EOF
          chmod +x AppDir/AppRun
          curl -fsSL -o appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool.AppImage" | sha256sum -c -
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run AppDir dist/ai-photo-defense-linux-x64-unsigned.AppImage
      - name: Generate checksums
        run: |
          cp LICENSE THIRD_PARTY.md PRIVACY.md dist/
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-linux-x64-unsigned
          path: dist/
          retention-days: 14

  macos-dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: x64-intel
          - target: aarch64-apple-darwin
            arch: arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.100.0 --profile minimal
      - run: rustup target add ${{ matrix.target }} --toolchain 1.100.0
      - name: Build release binaries
        run: cargo build --locked --release --target ${{ matrix.target }} -p photo-desktop -p photo-cli --features photo-desktop/faces,photo-desktop/c2pa,photo-cli/faces,photo-cli/c2pa
      - name: Create .app bundle and unsigned .dmg
        run: |
          APP="dist/stage/AI Photo Defense.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/photo-desktop" "$APP/Contents/MacOS/photo-desktop"
          cp "target/${{ matrix.target }}/release/photo-defense" "$APP/Contents/MacOS/photo-defense"
          cp packaging/macos/Info.plist "$APP/Contents/Info.plist"
          cp LICENSE THIRD_PARTY.md PRIVACY.md "$APP/Contents/Resources/"
          hdiutil create -volname "AI Photo Defense (Unsigned)" -srcfolder dist/stage -ov -format UDZO "dist/ai-photo-defense-macos-${{ matrix.arch }}-unsigned.dmg"
          rm -rf dist/stage
          cp LICENSE THIRD_PARTY.md PRIVACY.md dist/
          (cd dist && shasum -a 256 * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-macos-${{ matrix.arch }}-unsigned
          path: dist/
          retention-days: 14
