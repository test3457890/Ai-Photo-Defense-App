# cargo-deny policy. Run: cargo deny check
[graph]
all-features = false

[advisories]
# Unmaintained/unsound informational advisories are reviewed in docs/SECURITY_REVIEW.md.
unmaintained = "workspace"
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "Transitive via c2pa_raw_crypto 0.3.0 (optional c2pa feature); signing uses ES256 only, not RSA" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "OFL-1.1",
    "Unlicense",
    "0BSD",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
